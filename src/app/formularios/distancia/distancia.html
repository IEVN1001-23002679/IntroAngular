<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distancia</title>
</head>
<body>
<h2>Distancia entre dos puntos</h2>

<form>

    <label for="x1">X1:</label>
    <input
        [(ngModel)]="x1"
        name="x1"
        type="text"
        id="x1"
    >

    <br><br>

    <label for="y1">Y1:</label>
    <input
        [(ngModel)]="y1"
        name="y1"
        type="text"
        id="y1"
    >

    <br><br>

    <label for="x2">X2:</label>
    <input
        [(ngModel)]="x2"
        name="x2"
        type="text"
        id="x2"
    >

    <br><br>

    <label for="y2">Y2:</label>
    <input
        [(ngModel)]="y2"
        name="y2"
        type="text"
        id="y2"
    >

    <br><br>

    <button
        (click)="calcular()"
        type="button">
        Calcular
    </button>

</form>

<h3>Distancia: {{resultado}}</h3>
</body>
</html>
