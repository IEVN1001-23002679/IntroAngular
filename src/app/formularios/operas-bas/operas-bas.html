<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                      <form>

                    <div class="form-group pt-4">
                        <label for="num1">Número 1:</label>
                        <input
                            [(ngModel)]="num1"
                            name="num1"
                            type="number"
                            class="form-control"
                            id="num1"
                            placeholder="Ingrese número 1"
                        />
                    </div>

                    <div class="form-group pt-4">
                        <label for="num2">Número 2:</label>
                        <input
                            [(ngModel)]="num2"
                            name="num2"
                            type="number"
                            class="form-control"
                            id="num2"
                            placeholder="Ingrese número 2"
                        />
                    </div>

                    <div class="form-group pt-4">

                        <label>Seleccione una operación:</label>

                        <div>
                            <input
                                type="radio"
                                id="sumar"
                                name="operacion"
                                value="sumar"
                                [(ngModel)]="operacion"
                            />
                            <label for="sumar"> Sumar</label>
                        </div>

                        <div>
                            <input
                                type="radio"
                                id="restar"
                                name="operacion"
                                value="restar"
                                [(ngModel)]="operacion"
                            />
                            <label for="restar"> Restar</label>
                        </div>

                        <div>
                            <input
                                type="radio"
                                id="dividir"
                                name="operacion"
                                value="dividir"
                                [(ngModel)]="operacion"
                            />
                            <label for="dividir"> Dividir</label>
                        </div>

                        <div>
                            <input
                                type="radio"
                                id="multiplicar"
                                name="operacion"
                                value="multiplicar"
                                [(ngModel)]="operacion"
                            />
                            <label for="multiplicar"> Multiplicar</label>
                        </div>

                    </div>

                    <br>

                    <button
                        (click)="calcular()"
                        type="button"
                        class="btn btn-primary">
                        Calcular
                    </button>

                </form>
            </div>
            <div class="col-6">
                <h2>resultado: {{resultado}}</h2>
            </div>
        </div>
    </div>
</body>
</html>
